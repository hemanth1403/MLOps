global:
  resolve_timeout: 5m

# Route configuration
route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: "default"

  # Child routes
  routes:
    - match:
        severity: critical
      receiver: "critical-alerts"
      continue: true

    - match:
        severity: warning
      receiver: "warning-alerts"

    - match:
        severity: info
      receiver: "info-alerts"

# Receivers (notification channels)
receivers:
  - name: "default"
    # Default receiver - logs to console

  - name: "critical-alerts"
    # Configure for critical alerts (e.g., PagerDuty, Slack)
    # Example Slack configuration (uncomment and configure):
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#ml-alerts-critical'
    #     title: 'Critical ML Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: "warning-alerts"
    # Configure for warning alerts
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#ml-alerts-warning'
    #     title: 'Warning ML Alert'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: "info-alerts"
    # Configure for info alerts
    # email_configs:
    #   - to: 'ml-team@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'your-email@gmail.com'
    #     auth_password: 'your-app-password'

# Inhibition rules (silence certain alerts when others are firing)
inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]

version: '3.8'

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlflow_server
    user: root
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow:rw
    ports:
      - "5001:5000"
    networks:
      - ml_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus_server
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ml_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana_server
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ml_network
    restart: unless-stopped

  ml_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_serving_api
    environment:
      - MLFLOW_TRACKING_URI=http://host.docker.internal:5001    # FIXED: Changed from 5001 to 5000
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_metrics
    volumes:
      - ./src:/app/src:ro
    ports:
      - "8000:8000"
    networks:
      - ml_network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - ml_network
    restart: unless-stopped

volumes:
  # mlflow_data is NOT here because we're using bind mount
  mlflow_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  ml_network:
    driver: bridge
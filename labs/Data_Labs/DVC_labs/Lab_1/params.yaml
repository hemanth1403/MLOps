# ============================================
# DVC Pipeline Parameters
# Modify these to run different experiments
# ============================================

data:
  # Dataset source URL (UCI Heart Disease)
  source_url: "https://archive.ics.uci.edu/ml/machine-learning-databases/heart-disease/processed.cleveland.data"
  raw_path: "data/raw/heart_disease.csv"
  processed_path: "data/processed"
  test_split: 0.2
  random_seed: 42

preprocessing:
  # Feature scaling method: "standard" or "minmax"
  scaler_type: "standard"
  # Handle missing values: "median", "mean", or "drop"
  missing_strategy: "median"
  # Whether to create polynomial features
  poly_features: false
  poly_degree: 2

train:
  # Model type: "random_forest", "gradient_boosting", or "logistic_regression"
  model_type: "gradient_boosting"
  random_seed: 42

  # Random Forest hyperparameters
  random_forest:
    n_estimators: 150
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"

  # Gradient Boosting hyperparameters
  gradient_boosting:
    n_estimators: 200
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8

  # Logistic Regression hyperparameters
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"

evaluate:
  # Metrics to compute
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc

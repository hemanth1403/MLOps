# Logstash pipeline for the ELK Lab.
#
# All three log files are newline-delimited JSON, so no grok parsing is needed.
# The pipeline routes each log type to its own dated Elasticsearch index:
#   elk-training-YYYY.MM.dd  — model training metrics
#   elk-api-YYYY.MM.dd       — FastAPI prediction requests
#   elk-drift-YYYY.MM.dd     — KS-test drift detection results

input {
  file {
    path          => "/app/logs/training.log"
    start_position => "beginning"
    sincedb_path   => "/dev/null"
    codec          => json
    tags           => ["training"]
  }

  file {
    path          => "/app/logs/api.log"
    start_position => "beginning"
    sincedb_path   => "/dev/null"
    codec          => json
    tags           => ["api"]
  }

  file {
    path          => "/app/logs/drift.log"
    start_position => "beginning"
    sincedb_path   => "/dev/null"
    codec          => json
    tags           => ["drift"]
  }
}

filter {
  # Promote the application timestamp to Logstash's @timestamp
  if [timestamp] {
    date {
      match  => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
    mutate { remove_field => ["timestamp"] }
  }
}

output {
  if "training" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "elk-training-%{+YYYY.MM.dd}"
    }
  } else if "api" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "elk-api-%{+YYYY.MM.dd}"
    }
  } else if "drift" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "elk-drift-%{+YYYY.MM.dd}"
    }
  }

  stdout { codec => dots }
}

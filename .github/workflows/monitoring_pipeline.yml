name: ML Monitoring Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'labs/Experiment_tracking_labs/Mlflow_labs/Lab2/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'labs/Experiment_tracking_labs/Mlflow_labs/Lab2/**'
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours

env:
  PYTHON_VERSION: '3.9'
  LAB_DIR: 'labs/Experiment_tracking_labs/Mlflow_labs/Lab2'

jobs:
  # Job 1: Train models and track experiments
  train_and_track:
    name: Train Models with MLflow Tracking
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Start MLflow server
        working-directory: ${{ env.LAB_DIR }}
        run: |
          # Start MLflow in background
          mlflow server \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns \
            --host 0.0.0.0 \
            --port 5000 &
          
          # Wait for server to start
          sleep 10
          
          # Check if MLflow is running
          curl -f http://localhost:5000/health || exit 1
      
      - name: Train baseline model (Logistic Regression)
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python src/train.py \
            --model-type logistic_regression \
            --experiment-name ci-experiment \
            --run-name "lr-baseline-${{ github.sha }}"
      
      - name: Train Random Forest model
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python src/train.py \
            --model-type random_forest \
            --experiment-name ci-experiment \
            --run-name "rf-${{ github.sha }}" \
            --n-estimators 100 \
            --max-depth 10
      
      - name: Train XGBoost model
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python src/train.py \
            --model-type xgboost \
            --experiment-name ci-experiment \
            --run-name "xgb-${{ github.sha }}" \
            --n-estimators 100 \
            --learning-rate 0.1
      
      - name: Compare models and select best
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python -c "
          import mlflow
          import pandas as pd
          
          mlflow.set_tracking_uri('http://localhost:5000')
          
          # Get all runs from experiment
          experiment = mlflow.get_experiment_by_name('ci-experiment')
          runs = mlflow.search_runs(experiment_ids=[experiment.experiment_id])
          
          # Sort by test accuracy
          best_run = runs.sort_values('metrics.test_accuracy', ascending=False).iloc[0]
          
          print('='*60)
          print('BEST MODEL RESULTS')
          print('='*60)
          print(f\"Run ID: {best_run['run_id']}\")
          print(f\"Model: {best_run['params.model_type']}\")
          print(f\"Accuracy: {best_run['metrics.test_accuracy']:.4f}\")
          print(f\"F1-Score: {best_run['metrics.test_f1_score']:.4f}\")
          print('='*60)
          
          # Save results for next job
          with open('best_model.txt', 'w') as f:
              f.write(f\"{best_run['run_id']}\")
          "
      
      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            ${{ env.LAB_DIR }}/mlruns/
            ${{ env.LAB_DIR }}/mlflow.db
            ${{ env.LAB_DIR }}/best_model.txt
          retention-days: 30
      
      - name: Generate experiment report
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python -c "
          import mlflow
          import pandas as pd
          
          mlflow.set_tracking_uri('http://localhost:5000')
          
          experiment = mlflow.get_experiment_by_name('ci-experiment')
          runs = mlflow.search_runs(experiment_ids=[experiment.experiment_id])
          
          # Create comparison table
          comparison = runs[[
              'params.model_type',
              'metrics.test_accuracy',
              'metrics.test_precision',
              'metrics.test_recall',
              'metrics.test_f1_score',
              'metrics.training_time_seconds'
          ]].sort_values('metrics.test_accuracy', ascending=False)
          
          print('\n📊 Model Comparison Report\n')
          print(comparison.to_string(index=False))
          
          # Save to file
          with open('experiment_report.md', 'w') as f:
              f.write('# ML Experiment Report\n\n')
              f.write(f'**Commit**: {chr(36)}{{{{ github.sha }}}}\n\n')
              f.write('## Model Comparison\n\n')
              f.write(comparison.to_markdown(index=False))
          "
      
      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('${{ env.LAB_DIR }}/experiment_report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  # Job 2: Test drift detection
  drift_detection:
    name: Data Drift Detection Tests
    runs-on: ubuntu-latest
    needs: train_and_track
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: ${{ env.LAB_DIR }}
        run: |
          pip install -r requirements.txt
      
      - name: Run drift detection tests
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python src/drift_detector.py
      
      - name: Test drift simulation
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python -c "
          from src.drift_detector import DriftDetector, simulate_drift
          from sklearn.datasets import load_diabetes
          import numpy as np
          
          # Load data
          X = load_diabetes().data
          X_ref = X[:200]
          X_curr = X[200:400]
          
          detector = DriftDetector()
          
          # Test 1: No drift
          print('\n🧪 Test 1: No Drift')
          results = detector.detect_multivariate_drift(X_ref, X_curr)
          assert not results['overall_drift'], 'False positive: Drift detected when none exists'
          print('✅ Passed')
          
          # Test 2: Significant drift
          print('\n🧪 Test 2: Significant Drift')
          X_drifted = simulate_drift(X_curr, 'mean_shift', severity=1.0)
          results = detector.detect_multivariate_drift(X_ref, X_drifted)
          assert results['overall_drift'], 'False negative: Drift not detected'
          print('✅ Passed')
          
          print('\n✅ All drift detection tests passed!')
          "

  # Job 3: Docker build and test
  docker_build:
    name: Build and Test Docker Services
    runs-on: ubuntu-latest
    needs: train_and_track
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        working-directory: ${{ env.LAB_DIR }}
        run: |
          docker build -t ml-serving:test .
      
      - name: Test Docker image
        run: |
          docker run --rm ml-serving:test python -c "
          import sys
          import importlib.util
          
          # Check required modules
          required = ['fastapi', 'mlflow', 'prometheus_client', 'sklearn']
          for module in required:
              spec = importlib.util.find_spec(module)
              assert spec is not None, f'{module} not found'
          
          print('✅ All dependencies verified')
          "
      
      - name: Start services with Docker Compose
        working-directory: ${{ env.LAB_DIR }}
        run: |
          docker-compose up -d
          
          # Wait for services to be healthy
          echo "Waiting for services to start..."
          sleep 30
          
          # Check service health
          docker-compose ps
      
      - name: Test API health
        working-directory: ${{ env.LAB_DIR }}
        run: |
          # Wait for API to be ready
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo "✅ API is healthy"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
      
      - name: Test Prometheus metrics
        run: |
          curl -f http://localhost:9090/-/healthy || exit 1
          echo "✅ Prometheus is healthy"
      
      - name: Test MLflow UI
        run: |
          curl -f http://localhost:5000/health || exit 1
          echo "✅ MLflow is healthy"
      
      - name: Cleanup
        if: always()
        working-directory: ${{ env.LAB_DIR }}
        run: |
          docker-compose down -v

  # Job 4: Integration tests
  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker_build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: ${{ env.LAB_DIR }}
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Start services
        working-directory: ${{ env.LAB_DIR }}
        run: |
          docker-compose up -d
          sleep 30
      
      - name: Download MLflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: mlflow-artifacts
          path: ${{ env.LAB_DIR }}/
      
      - name: Run API tests
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python -c "
          import requests
          import time
          
          # Test health endpoint
          resp = requests.get('http://localhost:8000/health')
          assert resp.status_code == 200, 'Health check failed'
          print('✅ Health check passed')
          
          # Test prediction endpoint
          features = [0.038, 0.05, 0.061, 0.021, -0.044, -0.034, -0.043, -0.002, 0.019, -0.017]
          resp = requests.post(
              'http://localhost:8000/predict',
              json={'features': features}
          )
          assert resp.status_code == 200, 'Prediction failed'
          result = resp.json()
          assert 'prediction' in result, 'Missing prediction'
          assert 'confidence' in result, 'Missing confidence'
          print(f'✅ Prediction test passed: {result}')
          
          # Test metrics endpoint
          resp = requests.get('http://localhost:8000/metrics')
          assert resp.status_code == 200, 'Metrics endpoint failed'
          assert 'model_requests_total' in resp.text, 'Missing metrics'
          print('✅ Metrics endpoint passed')
          
          print('\n✅ All integration tests passed!')
          "
      
      - name: Cleanup
        if: always()
        working-directory: ${{ env.LAB_DIR }}
        run: |
          docker-compose down -v

  # Job 5: Performance benchmarks
  performance_tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: integration_tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: ${{ env.LAB_DIR }}
        run: |
          pip install -r requirements.txt
          pip install locust
      
      - name: Start services
        working-directory: ${{ env.LAB_DIR }}
        run: |
          docker-compose up -d
          sleep 30
      
      - name: Run load tests
        working-directory: ${{ env.LAB_DIR }}
        run: |
          python -c "
          import requests
          import time
          import statistics
          
          url = 'http://localhost:8000/predict'
          features = [0.038, 0.05, 0.061, 0.021, -0.044, -0.034, -0.043, -0.002, 0.019, -0.017]
          
          latencies = []
          errors = 0
          
          print('Running load test (100 requests)...')
          for i in range(100):
              start = time.time()
              try:
                  resp = requests.post(url, json={'features': features}, timeout=5)
                  if resp.status_code == 200:
                      latencies.append(time.time() - start)
                  else:
                      errors += 1
              except Exception as e:
                  errors += 1
          
          if latencies:
              print(f'\n📊 Performance Results:')
              print(f'   Requests: 100')
              print(f'   Successes: {len(latencies)}')
              print(f'   Errors: {errors}')
              print(f'   Mean latency: {statistics.mean(latencies)*1000:.2f}ms')
              print(f'   Median latency: {statistics.median(latencies)*1000:.2f}ms')
              print(f'   P95 latency: {sorted(latencies)[int(len(latencies)*0.95)]*1000:.2f}ms')
              
              assert statistics.mean(latencies) < 0.5, 'Mean latency too high'
              assert errors < 5, 'Too many errors'
              print('\n✅ Performance tests passed!')
          "
      
      - name: Cleanup
        if: always()
        working-directory: ${{ env.LAB_DIR }}
        run: |
          docker-compose down -v

  # Job 6: Summary
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [train_and_track, drift_detection, docker_build, integration_tests, performance_tests]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🎉 ML Monitoring Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Model Training: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Drift Detection: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker Build: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Integration Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Performance Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review model metrics in MLflow UI" >> $GITHUB_STEP_SUMMARY
          echo "2. Check Prometheus metrics" >> $GITHUB_STEP_SUMMARY
          echo "3. View Grafana dashboards" >> $GITHUB_STEP_SUMMARY

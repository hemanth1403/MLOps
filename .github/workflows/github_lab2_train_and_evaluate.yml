name: Train and Evaluate Wine Quality Model

on:
  push:
    branches:
      - Main
  workflow_dispatch: # Also allow manual trigger

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r labs/Github_labs/Lab2/requirements.txt

      - name: Create necessary directories
        run: |
          mkdir -p data models metrics

      - name: Validate data
        run: |
          echo "Running data validation..."
          python labs/Github_labs/Lab2/src/data_validation.py

      - name: Train model with hyperparameter tuning
        run: |
          echo "Starting model training with hyperparameter tuning..."
          python labs/Github_labs/Lab2/src/train_model.py

      - name: Evaluate model
        run: |
          echo "Evaluating model performance..."
          python labs/Github_labs/Lab2/src/evaluate_model.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/
            metrics/
          retention-days: 30

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add models/ metrics/ data/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated model training and evaluation [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Training Summary
        run: |
          echo "=============================================="
          echo "Training Pipeline Completed Successfully!"
          echo "=============================================="
          echo ""
          echo "Check the metrics/ directory for:"
          echo "   - Evaluation results (JSON)"
          echo "   - Confusion matrix (PNG)"
          echo "   - Feature importance (PNG)"
          echo ""
          echo "Models saved in models/ directory"
          echo ""
          echo "View full logs in the Actions tab"
          echo "=============================================="
